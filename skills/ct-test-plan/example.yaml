ct: 1
kind: plan
addon: ClosestVendor
title: Example plan for a small change
preamble: Example only. Type |cff99ccff/cvn debug on|r, then |cff99ccff/reload|r, before the checks.
logs:
  debug:
    global: ClosestVendorCharDB
    path: log.entries
    format: entries
sections:
- id: s1
  title: Test sell question
  steps:
  - id: cv.s1.1
    title: Sell test question
    action:
      kind: manual
      text: Enter |cff99ccff/cvn test sell|r.
      commands:
      - /cvn test sell
    expect: a question shows a vendor name and a zone.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'test command: sell'
      label: Sell test command ran
    - kind: log
      source: debug
      contains: 'game call failed'
      absent: true
      scope: attempt
      label: No game call failed
  - id: cv.s1.2
    title: No question when disabled
    clients:
    - forever-camelot
    action:
      kind: manual
      text: Enter |cff99ccff/cvn test sell|r.
      commands:
      - /cvn test sell
    setup: Turn the addon off in its settings.
    cleanup: Turn the addon on again.
    expect: no question shows.
    verify:
    - player
