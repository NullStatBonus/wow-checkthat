ct: 1
kind: plan
addon: DontDoThat
title: DontDoThat in-game test plan
preamble: The live-client checks for DontDoThat. Install the build and /reload, then type /ddt debug on.
  Loading the addon turns debug recording off, so turn it on after the reload.
logs:
  debug:
    global: DontDoThatDB
    path: global.log.entries
    format: entries
    cap: 500
requirements:
  addon-loaded:
    text: DontDoThat is loaded
    probe: addon-loaded
    name: DontDoThat
sections:
- id: s1
  title: Spend is counted when the gold leaves
  steps:
  - id: ddt.s1.1
    title: On either client, at a vendor, buy armor
    action:
      kind: manual
      text: On either client, at a vendor, buy armor or a weapon that costs more than 1 silver and choose
        Buy anyway.
    expect: Progress > "Spent on things the addon marked" goes up by the item's price.
    verify:
    - player
    - assertions
    - reviewer
    reviewer: 'items: spend of <price> pending, then items: spent <price> counted.'
    assertions:
    - kind: log-sequence
      source: debug
      scope: attempt
      sequence:
      - pattern: '^items: spend of %d+ pending'
      - pattern: '^items: spent %d+ counted'
      label: Spend counted after the purchase
- id: s2
  title: Trainer and beast training (Classic Era, Hunter)
  steps:
  - id: ddt.s2.1
    title: At your class trainer, buy a marked spell
    action:
      kind: manual
      text: At your class trainer, buy a marked spell with Buy anyway, then open Beast Training and train
        a pet ability.
    expect: both are learned, and no "blocked from an action" message shows.
    verify:
    - player
    - reviewer
    - assertions
    reviewer: 'confirm: bought <spell> anyway and no confirm: prompts disabled line.'
    assertions:
    - kind: log
      source: debug
      pattern: '^confirm: bought .+ anyway$'
      scope: attempt
      label: Spell bought with Buy anyway
    - kind: log
      source: debug
      pattern: '^confirm: prompts disabled'
      scope: attempt
      absent: true
      label: Prompts were not disabled
    clients:
    - classic-era
- id: s3
  title: Always Allow (either client)
  steps:
  - id: ddt.s3.1
    title: At a vendor, buy armor or a weapon
    action:
      kind: manual
      text: At a vendor, buy armor or a weapon that costs more than 1 silver and choose Always Allow.
    expect: the question has three buttons, and the item is bought.
    verify:
    - player
    - assertions
    - reviewer
    reviewer: 'items: always allowed <item ID> <name>.'
    assertions:
    - kind: log
      source: debug
      pattern: '^items: always allowed %d+ '
      scope: attempt
      label: Always Allow recorded
  - id: ddt.s3.2
    title: Buy the same item again
    action:
      kind: manual
      text: Buy the same item again.
    expect: the item is bought without a question.
    verify:
    - player
    - assertions
    - reviewer
    reviewer: 'items: vendor <name> ... -> passed through: allowed.'
    assertions:
    - kind: log
      source: debug
      contains: 'passed through: allowed'
      diagnostic: true
