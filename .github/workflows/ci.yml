name: CI

# Tests and checks on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT and Python
        run: sudo apt-get update && sudo apt-get install -y luajit python3 python3-venv
      - name: Python tools
        run: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt -r requirements-tui.txt
      - name: Tests
        run: make test
      - name: Checks
        run: make check

  python-tools:
    # The Python tools run on the systems players use.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-tui.txt
      - run: python -m unittest discover -s tools -p "test_ct.py"
        env:
          PYTHONUTF8: '1'
