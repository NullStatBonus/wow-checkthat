name: CI

# Tests and checks on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT and Python
        run: sudo apt-get update && sudo apt-get install -y luajit python3 python3-venv
      - name: Python tools
        run: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
      - name: Tests
        run: make test
      - name: Checks
        run: make check
